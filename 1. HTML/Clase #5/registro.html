<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <form action="">
        <label for="nombre">Nombre y apellido</label>
        <br>
        <input type="text" name="nombre" id="nombre" required>
        <br>
        <label>Correo electrónico</label>
        <br>
        <input 
            type="email" 
            name="correo" 
            pattern="^[a-zA-Z0-9._%+-]+@neoland\.es$"  
            title="Por favor, indicar que el correo sea @neoland.es" 
            required>
        <br>
        <label>Password</label>
        <br>
        <input type="password" name="password" required>
        <br>
        <label>Teléfono</label>
        <br>
        <input 
            type="tel" 
            name="telefono" 
            placeholder="Formato Ej: 111-11-111"
            pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"
            title="Por favor, indicar teléfono en formato 111-11-111"
        >
        <br>
        <label>Dirección</label>
        <br>
        <input type="text" name="direccion">
        <br>
        <label>Fecha de nacimiento</label>
        <br>
        <input type="date" name="fechaNac" required>
        <br>
        <input type="submit" value="Registrarme">
    </form>
</body>
</html>
