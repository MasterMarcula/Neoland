<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <form action="">
        <label for="">Alias</label>
        <br>
        <input type="text" value="UsuarioNeolandese"  disabled>
        <br>
        <label>Nombre y apellido</label>
        <br>
        <input type="text" name="nombre" value="María" readonly required>
        <br>
        <label>Correo electrónico</label>
        <br>
        <input type="email" name="correo" value="maria@neoland.es" required>
        <br>
        <label>Password</label>
        <br>
        <input type="password" name="password" value="qwerty12345" required>
        <br>
        <label>Teléfono</label>
        <br>
        <input type="tel" name="telefono" value="2222-3333">
        <br>
        <label>Dirección</label>
        <br>
        <input type="text" name="direccion" value="Calle 1 34">
        <br>
        <label>Fecha de nacimiento</label>
        <br>
        <input type="date" name="fechaNac" value="01/01/2000"  required>
        <br>
        <input type="submit" value="Registrarme">
    </form>
</body>
</html>
