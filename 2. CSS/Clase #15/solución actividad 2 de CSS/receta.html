<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receta de Guacamole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="receta.css">
</head>

<body>

  <header>
    <h1>Receta de Guacamole</h1>
  </header>

  <main>

    <figure>
      <div class="textohero">
        <h2>La receta mexicana <br>
        más conocida</h2>
      </div>
      <img src="https://images.unsplash.com/photo-1680992071073-cb1696ba8d3e" alt="Guacamole con nachos">
      <figcaption>Guacamole casero con nachos</figcaption>
    </figure>
    <section class="contenedor">



      <!-- INGREDIENTES -->
      <article class="card">
        <h2>Ingredientes</h2>
        <ul>
          <li>2 aguacates</li>
          <li>1 tomate picado</li>
          <li>1/4 cebolla morada picada</li>
          <li>Cilantro al gusto</li>
          <li>1/2 limón</li>
        </ul>
      </article>

      <!-- INSTRUCCIONES -->
      <article class="card">
        <h2>Preparación</h2>
        <ol>
          <li>Machacar los aguacates</li>
          <li>Agregar tomate y cebolla</li>
          <li>Limón a gusto</li>
          <li>Mezclar y salar</li>
        </ol>
      </article>

    </section>



  </main>

  <footer>
    <p>© 2026 - Recetas Web</p>
  </footer>

</body>

</html>
