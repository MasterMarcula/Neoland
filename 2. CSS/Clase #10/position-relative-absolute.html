<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        .caja {
            width: 50px;
            height: 50px;
            background-color: aquamarine;
            border: solid 1px
        }
        .absoluta,
        .relativa {
            background-color: rgba(0, 0, 255, 0.6);
            color: white;
            border-color: brown;
        }
        /* Se mueve desde su posición hacia otra posición según los elementos que tenga alrededor */
        .relativa {
            /* Position */
            position: relative;
            top: 30px;
            left: 10px;
            z-index: 1;
        }
        .absoluta {
            position: absolute;
            right: 0;
            top: 0
        }
        /* ¿Cómo "manejar" al hijo "rebelde"? */
        header {
            background-color:darkkhaki;
            height: 100px;
            position: relative;
        }
        ul {
            list-style: none;
        }
        li {
            display: inline;
        }
        #logo {
            position: absolute;
            left: 20px;
            top: 30px;
        }
    </style>
</head>
<body>
    <div class="caja">Item 1</div>
    <div class="caja relativa">Item 2</div>
    <div class="caja absoluta">Item 3</div>
    <div class="caja">Item 4</div>
    <hr>
    <header><!-- padre del logo -->
        <img src="neoland-n-logotipo.png" alt="" width="32" id="logo">
        <nav>
            <ul>
                <li><a href="">Inicio</a></li>
                <li><a href="">Productos</a></li>
                <li><a href="">Contacto</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
