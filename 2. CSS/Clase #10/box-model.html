<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        /* Etiquetas "block" */
        div {
            background-color: red;
            padding: 10px;
            border: solid yellow 5px;
            width: 50%;
            height: 100px;
            border-radius: 10px;

        }
        section {
            background-color: aqua;
            height: 50%;
        }

        /* Inline */
        a {
            margin: 10px; /* solo los costados */
            padding: 10px; /* solo los costados */
            border: solid 1px black;
            width: 100px; /* lo omite */
            height: 100px; /* lo omite */
        }
    </style>
</head>
<body>
    <div>
        <section>
            <p>Lorem ipsum dolor sit amet <a href="https://developer.mozilla.org/es/docs/Learn/CSS/Building_blocks/The_box_model">Display vs block.</a></p>
        </section>
    </div>
</body>
</html>
