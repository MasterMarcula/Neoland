<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        .caja {
            background-color: cadetblue;
            padding-top: 100px;
            padding-bottom: 50px;
            padding-left: 10px;
            padding-right: 30px;
            /*       0     3     6     9 hs*/ 
            /*       top right bottom left*/
            padding: 100px 30px  50px 10px;
            /* top-bottom / right-left */
            padding: 50px 20px;

            margin-top: 100px;
            margin-bottom: 50px;
            margin-left: 10px;
            margin-right: 30px;

            border-top: dotted 5px forestgreen;
            border-top-style: solid;
            border-top-width: 5px;
            border-top-color: forestgreen;

            border-bottom: dashed 5px;
            border-left: double 5px;
            border-right: inset 5px;

            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            
        }
        .caja2 {
            padding-left: 10px;
            border-bottom: 5px solid black;
            border-left: 5px solid black;
        }
    </style>
</head>
<body>
    <div class="caja">
        Hola mundo
    </div>
    <div class="caja2">
        Item 1
    </div>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Laborum rerum nesciunt veritatis voluptatibus maiores iste voluptas, ratione eos ab delectus.</p>
    <div class="caja2">
        Item 2
    </div>
</body>
</html>
