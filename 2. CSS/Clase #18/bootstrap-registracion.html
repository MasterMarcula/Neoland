<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="col-md-7 col-lg-8">
            <h4 class="mb-3">Billing address</h4>

            <form action="https://formspree.io/f/mbdzpzba" method="post">
                <div class="row">
                    <div> 
                        <label for="firstName" class="form-label">First name</label> <input type="text" class="form-control" id="firstName" name="firstName">
                    </div>
                    <div> 
                        <label for="lastName" class="form-label">Last name</label> 
                        <input type="text" class="form-control" id="lastName" name="lastName">
                    </div>
                    <div> 
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username">
                    </div>
                    <div> 
                        <label for="email" class="form-label">Email</label> 
                        <input type="email" class="form-control" id="email" placeholder="you@example.com" name="email">
                    </div>
                    <div> 
                        <label for="address" class="form-label">Address</label> <input type="text" class="form-control" id="address" placeholder="1234 Main St" name="address">
                    </div>
                    <div> 
                        <label for="country" class="form-label">Country</label> <select class="form-select" id="country" required="" name="country">
                            <option value="">Choose...</option>
                            <option value="españa">España</option>
                            <option value="argentina">Argentina</option>
                        </select>
                    </div>
                </div>
                <hr class="my-3">

                <div class="form-check form-switch"> 
                    <input type="checkbox" class="form-check-input" id="same-address" role="switch" name="same-address" value="yes"> 
                    <label class="form-check-label" for="same-address">Shipping address is the same as my billing address</label> 
                </div>
                <div class="form-check form-switch"> 
                    <input type="checkbox" class="form-check-input" id="save-info" role="switch" name="save-info" value="yes"> 
                    <label class="form-check-label" for="save-info">Save this information for next time</label> 
                </div>
                <hr class="my-4">
                <h4 class="mb-3">Payment</h4>
                <div>
                    <div class="form-check"> 
                        <input id="credit" name="paymentMethod" type="radio" class="form-check-input" checked="" required="" value="credit card"> 

                        <label class="form-check-label" for="credit">Credit card</label> 
                    </div>
                    <div class="form-check"> 
                        <input id="debit" name="paymentMethod" type="radio" class="form-check-input" required="" value="debit card"> 
                        <label class="form-check-label" for="debit">Debit card</label> 
                    </div>
                    <div class="form-check"> <input id="paypal" name="paymentMethod" type="radio" class="form-check-input" required="" value="paypal"> 
                        <label class="form-check-label" for="paypal">PayPal</label> 
                    </div>
                </div>
                <hr class="my-4"> <button class="w-100 btn btn-primary btn-lg" type="submit">Continue to checkout</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
