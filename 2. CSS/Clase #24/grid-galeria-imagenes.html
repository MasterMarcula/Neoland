<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{ margin: 0; padding: 0; box-sizing: border-box;}
        body {
            max-width: 1200px;
            width: 100%;
            margin: auto;
        }
        img {
            max-width: 100%;
            height: auto;
        }
section {
    display: grid;
    grid-template-columns: 1fr;
    gap: 5px;
}
img:nth-child(3) {
    grid-row-start: 1;
    grid-row-end: 3;
    grid-column-start: 2;
    grid-column-end: 4;
}

@media (min-width: 768px) {
    section {
    grid-template-columns: repeat(5, 1fr);
}

}
    </style>
</head>
<body>

    <section>
        <img src="https://picsum.photos/500/300?random=1" alt="">
        <img src="https://picsum.photos/500/300?random=2" alt="">
        <img src="https://picsum.photos/500/300?random=3" alt="">
        <img src="https://picsum.photos/500/300?random=4" alt="">
        <img src="https://picsum.photos/500/300?random=5" alt="">
        <img src="https://picsum.photos/500/300?random=6" alt="">
        <img src="https://picsum.photos/500/300?random=7" alt="">
        <img src="https://picsum.photos/500/300?random=8" alt="">
        <img src="https://picsum.photos/500/300?random=9" alt="">
        <img src="https://picsum.photos/500/300?random=10" alt="">
        <img src="https://picsum.photos/500/300?random=11" alt="">
        <img src="https://picsum.photos/500/300?random=12" alt="">
    </section>
</body>
</html>
