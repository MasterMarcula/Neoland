<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <style>
        .bi-brush {
            color: rgb(227, 216, 53);
            font-size: 40px;
            text-align: center;
            display: block;
        }
        
    </style>

<body>
    <div class="container">
        <div class="card mb-3">

                <i class="bi bi-brush"></i>
                <h5 class="card-title">Diseño UX/UI</h5>
                <p class="card-text">Diseño interfaces centradas en el usuario, con foco en la usabilidad y la experiencia. Desde wireframes hasta prototipos interactivos listos para validar ideas.</p>
        
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"

</html>
