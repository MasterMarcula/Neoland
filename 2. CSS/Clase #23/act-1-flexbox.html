<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
            1 Centrar los elementos horizontalmente
            2 Centrarlos verticalmente
            3 Centrar completamente
            4 Separarlos con espacio entre ellos
            5 Invertir la dirección
            6 Es posible que deban agregar un poco de CSS para manejar el tamaño del padre

            GUIA rápida --> https://drive.google.com/file/d/1owyKLUTj8Vfwe1-x9p0y0LM3YPCMCTYa/view?usp=drive_link
        */
        .container {
            display: flex;
            flex-direction: row-reverse;
            height: 200px;
            background-color: lightgray;
            gap: 15px;
        }

        .item {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #bdacac, #f06595);
            border: #6e5151 solid 5px;
            box-shadow: inset 0 0 10px #6e5151;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 2.5rem;
            margin: auto;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
</body>

</html>
