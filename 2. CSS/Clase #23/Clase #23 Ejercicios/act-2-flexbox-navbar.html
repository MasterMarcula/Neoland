<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*
        Crear una barra de navegación como esta:
        [ LOGO ]     			   [ Inicio | Recetas | Contacto ]       			 [ Login ]
        

        =Requisitos+
        - todo en una misma fila
        - logo a la izquierda
        - menú centrado
        - botón login a la derecha
        - que quede bien alineado verticalmente

        */

    </style>
</head>

<body>
    <nav class="navbar">
        <div class="logo">MiSitio</div>

        <ul class="menu">
            <li>Inicio</li>
            <li>Recetas</li>
            <li>Contacto</li>
        </ul>

        <button class="login">Login</button>
    </nav>
</body>

</html>
