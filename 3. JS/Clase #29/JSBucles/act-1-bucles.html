<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background-color: antiquewhite;
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      form {
        margin-bottom: 20px;
        background-color: rgb(233, 215, 192);
        padding: 10px;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      input[type="number"] {
        width: 40%;
        padding: 10px;
        margin: 5px;
      }
      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
    <title>Bucles #1</title>
  </head>

  <body>
    <header>
      <h1>Asistente telefónico</h1>
      <p>
        El programa debe seguir pidiendo un número mientras el usuario no
        ingrese el 0.
      </p>
    </header>
    <main>
      <form>
        <label for="numberInput">Ingrese un número:</label>
        <input type="number" id="numberInput" name="numberInput" />
        <button onclick="getNumber()">Enviar</button>
      </form>
      <section>
        <h2>Opciones:</h2>
        <ul>
          <li>Opción 3: Consultar saldo.</li>
          <li>Opción 4: Hablar con un operador</li>
          <li>Opción 5: Cargar crédito.</li>
          <li>Opción 0: Salir</li>
        </ul>
      </section>
    </main>
    <script>
      function getNumber() {
        const opcion = document.getElementById("numberInput");

        do {
          const number = parseInt(opcion.value);
          if (number == 0) {
            alert("Saliendo del programa.");
            break;
          } else if (!isNaN(number)) {
            switch (number) {
              case 1:
              case 2:
              case 3:
                alert("Consultando saldo...");
                break;
              case 4:
                alert("Hablando con un operador...");
                break;
              case 5:
                alert("Cargando crédito...");
                break;
              default:
                alert(
                  "Opción no válida. Por favor, ingrese una opción válida.",
                );
            }
          }
          alert("Ingrese otro número o 0 para salir.");
        } while (number !== 0);
        alert("Ya puede cerrar la página.");
        return 0;
      } 
    </script>
  </body>
</html>
